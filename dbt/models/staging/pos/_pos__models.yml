version: 2

models:
  - name: stg_pos__transaction
    description: Taproom transactions, one row per transaction even when the POS file was sent more than once.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: transaction_status
        data_tests:
          - accepted_values:
              values: [COMPLETED, REFUNDED]
      - name: total_amount
        data_tests: [non_negative]

  - name: stg_pos__line_item
    description: >
      Taproom line items, one row per transaction and line. Brand and serving size are parsed out of
      the POS item code so taproom volume converts to barrels the same way packaged sales do.
    data_tests:
      - unique:
          column_name: "concat(transaction_id, '|', cast(line_id as varchar(6)))"
    columns:
      - name: transaction_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_pos__transaction')
              field: transaction_id
      - name: sales_category
        data_tests:
          - accepted_values:
              values: [Draft, To-Go, Merch]
      - name: package_code
        description: Serving size as a ref_uom_conversion code. Null for merchandise.
        data_tests:
          - relationships:
              to: ref('ref_uom_conversion')
              field: package_code

unit_tests:
  - name: stg_pos__transaction_drops_resent_file_duplicates
    description: The same day's file lands twice; each transaction is kept once.
    model: stg_pos__transaction
    given:
      - input: source('pos', 'pos_transaction')
        rows:
          - {transaction_id: T-20261031-0001, created_at: "2026-10-31T12:05:00", status: COMPLETED, total: 15.26, _source_file: transactions_2026-10.json, _ingested_at: "2026-11-01 02:00:00"}
          - {transaction_id: T-20261031-0002, created_at: "2026-10-31T12:09:00", status: COMPLETED, total: 7.63, _source_file: transactions_2026-10.json, _ingested_at: "2026-11-01 02:00:00"}
          - {transaction_id: T-20261031-0001, created_at: "2026-10-31T12:05:00", status: COMPLETED, total: 15.26, _source_file: transactions_2026-10-31_resend.json, _ingested_at: "2026-11-02 02:00:00"}
          - {transaction_id: T-20261031-0002, created_at: "2026-10-31T12:09:00", status: COMPLETED, total: 7.63, _source_file: transactions_2026-10-31_resend.json, _ingested_at: "2026-11-02 02:00:00"}
    expect:
      rows:
        - {transaction_id: T-20261031-0001, transaction_date: "2026-10-31", total_amount: 15.26}
        - {transaction_id: T-20261031-0002, transaction_date: "2026-10-31", total_amount: 7.63}

  - name: stg_pos__line_item_parses_brand_and_serving_size
    description: Draft pours, to-go packs and merchandise each get the right brand and package code.
    model: stg_pos__line_item
    given:
      - input: source('pos', 'pos_line_item')
        rows:
          - {transaction_id: T-1, line_id: 1, item_code: DRAFT-NSL, category: Draft, variation: "16 oz", quantity: 2, unit_price: 7.0, discount_amount: 0.0, line_total: 14.0, _ingested_at: "2026-11-01 02:00:00"}
          - {transaction_id: T-1, line_id: 2, item_code: DRAFT-PBI, category: Draft, variation: "Flight", quantity: 1, unit_price: 12.0, discount_amount: 0.0, line_total: 12.0, _ingested_at: "2026-11-01 02:00:00"}
          - {transaction_id: T-1, line_id: 3, item_code: TOGO-SZL-6x12, category: To-Go, variation: "6-pack 12 oz", quantity: 1, unit_price: 12.0, discount_amount: 0.0, line_total: 12.0, _ingested_at: "2026-11-01 02:00:00"}
          - {transaction_id: T-1, line_id: 4, item_code: MERCH-HAT, category: Merch, variation: "", quantity: 1, unit_price: 22.0, discount_amount: 0.0, line_total: 22.0, _ingested_at: "2026-11-01 02:00:00"}
    expect:
      rows:
        - {line_id: 1, brand_code: NSL, package_code: POUR-16, quantity: 2}
        - {line_id: 2, brand_code: PBI, package_code: FLIGHT, quantity: 1}
        - {line_id: 3, brand_code: SZL, package_code: PK-6x12, quantity: 1}
        - {line_id: 4, brand_code: null, package_code: null, quantity: 1}
