# Checked in on purpose: every value comes from environment variables, no secrets here.
# Load them with:  . .\scripts\load_env.ps1   (reads .env and sets DBT_PROFILES_DIR)
# Sign in with:    az login
lpb:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &fabric
      type: fabric
      # TODO(spike): dbt-fabric 1.11+ bundles its own driver; confirm whether this line is still needed.
      driver: "ODBC Driver 18 for SQL Server"
      server: "{{ env_var('FABRIC_SQL_ENDPOINT', 'set-FABRIC_SQL_ENDPOINT-in-.env') }}"
      port: 1433
      database: "{{ env_var('FABRIC_WAREHOUSE', 'wh_analytics') }}"
      schema: dbo
      authentication: CLI
      threads: 4
      retries: 2
    # Pull-request builds land in throwaway schemas: ci_pr123_silver, ci_pr123_gold, ...
    ci:
      <<: *fabric
      schema: "{{ env_var('DBT_CI_SCHEMA', 'ci_local') }}"
      authentication: "{{ env_var('DBT_FABRIC_AUTH', 'CLI') }}"
