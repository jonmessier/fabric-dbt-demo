name: lpb
version: "1.0.0"
config-version: 2
profile: lpb

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Schemas are literal (silver, gold, ...) thanks to macros/generate_schema_name.sql.
models:
  lpb:
    staging:
      +schema: silver
      +materialized: view
      +tags: ["silver"]
    intermediate:
      +schema: silver
      +materialized: view
      +tags: ["silver"]
    marts:
      +schema: gold
      +materialized: table
      +tags: ["gold"]

seeds:
  lpb:
    +schema: ref
    +tags: ["ref"]

snapshots:
  lpb:
    +schema: snapshots
    +tags: ["silver"]

# Failing rows of every data test are kept in the audit schema for review.
data_tests:
  lpb:
    +store_failures: true
    +schema: audit

# Phase 5: on-run-end hook that writes one row per node to audit.dbt_run_log
# on-run-end:
#   - "{{ log_run_results(results) }}"
